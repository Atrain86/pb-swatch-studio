<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ColorShare</title>
<meta name="description" content="Collect colors you love and turn them into beautiful palettes. Scan photos, match real surfaces, save and share.">
<meta name="theme-color" content="#0E0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ColorShare">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hdr"><div class="hdr-in" id="hdr"></div></header>
<main id="main"></main>
<nav class="nav" aria-label="Main"><div class="nav-in" id="nav"></div></nav>
<input type="file" accept="image/*" id="file" style="position:absolute;opacity:0;width:1px;height:1px;left:-10px;top:0" aria-hidden="true" tabindex="-1">
<input type="file" accept="image/*" capture="environment" id="cam" style="position:absolute;opacity:0;width:1px;height:1px;left:-10px;top:0" aria-hidden="true" tabindex="-1">
<div id="ov"></div><div id="ov2"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
