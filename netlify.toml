# Plain static site. The "build" only copies the files into dist/,
# which is the folder Netlify publishes. Nothing is compiled.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -r index.html styles.css app.js manifest.webmanifest sw.js icons dist/"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
